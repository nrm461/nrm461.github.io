name: Rebuild site
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'assets/thumbs/**'
      - 'assets/carousel/**'
      - '_build/**'
      - 'css/**'
      - 'js/**'
permissions:
  contents: write
concurrency:
  group: site-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # avoid rebuild loops from our own commit
    if: "!contains(github.event.head_commit.message, '[auto-build]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pull latest (multiple saves can land close together)
        run: git pull --rebase origin main
      - name: Build
        run: |
          python3 _build/build_site.py
          # the deck is generated too — without this its main.css?v= stamp froze at
          # whatever it was when someone last ran build_deck.py by hand, so a CSS
          # change (e.g. the IBM Plex switch) never reached browsers holding the
          # deck's cached copy of that URL.
          python3 _build/build_deck.py
      - name: Commit built pages
        run: |
          git config user.name "auto-build"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "[auto-build] regenerate pages"
          git pull --rebase -X theirs origin main || true
          git push
